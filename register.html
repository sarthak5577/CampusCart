<!DOCTYPE html>
<html>

<head>

    <title>
        CampusCart Register
    </title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="login-container">

    <h2>
        Create Account
    </h2>

    <p>
        Join CampusCart today
    </p>


    <form id="register-form">


        <input 
        type="text" 
        placeholder="Full Name">


        <input 
        type="email" 
        placeholder="Email">


        <input 
        type="password" 
        placeholder="Create Password">


        <input 
        type="text" 
        placeholder="College Name">


        <input 
        type="text" 
        placeholder="Year">


        <input 
        type="text" 
        placeholder="Branch">


         <button type="submit">
              Register
         </button>


    </form>


    <p>
        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>


</div>

<script src="js/script.js"></script>
</body>

</html>
