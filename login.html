<!DOCTYPE html>
<html>

<head>

    <title>
        CampusCart Login
    </title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <div class="login-container">

        <h2>
            Welcome Back
        </h2>

        <p>
            Login to continue with CampusCart
        </p>


        <form id="login-form">


            <input 
            type="email" 
            placeholder="Enter Email">


            <div class="password-box">

    <input 
    id="login-password"
    type="password" 
    placeholder="Enter Password">

    <span id="toggle-login-password">
        👁️
    </span>

            </div>

            <button type="submit">
                Login
            </button>


        </form>


        <p>
            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>


    </div>


    <script src="js/script.js"></script>

</body>

</html>
